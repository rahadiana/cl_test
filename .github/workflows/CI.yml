name: Public Tunnel Testing
on: [push]

jobs:
  test-with-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Install opencode ─────────────────────────────────────
      - name: Install opencode
        run: |
          npm install -g opencode-ai@latest
          echo "✅ opencode versi: $(opencode --version)"

      # ── Start 9router via Docker ─────────────────────────────
      - name: Start 9router
        run: |
          docker run -d \
            --name 9router \
            -p 20128:20128 \
            -e JWT_SECRET=ci-secret-key-12345 \
            -e INITIAL_PASSWORD=admin123 \
            decolua/9router:latest

      - name: Wait for 9router ready
        run: |
          echo "Menunggu 9router..."
          for i in {1..30}; do
            if curl -sf http://localhost:20128 > /dev/null 2>&1; then
              echo "✅ 9router ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 3
          done
          echo ""
          echo "=== Docker logs ==="
          docker logs 9router

      # ── Configure opencode pakai 9router ────────────────────
      - name: Configure opencode → 9router
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/config.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "@ai-sdk/openai-compatible": {
                "name": "9router",
                "options": {
                  "baseURL": "http://localhost:20128/v1",
                  "apiKey": "local"
                },
                "models": {
                  "kr/claude-sonnet-4.5": {
                    "name": "Claude via 9router"
                  }
                }
              }
            }
          }
          EOF
          echo "✅ opencode config:"
          cat ~/.config/opencode/config.json

        # ── Install cloudflared ──────────────────────────────────
      # ── Install opencode ─────────────────────────────────────
      - name: Install opencode
        run: |
          npm install -g opencode-ai@latest
          echo "✅ opencode versi: $(opencode --version)"
  
      # ── Start opencode sebagai runtime (background) ──────────
      - name: Start opencode runtime
        run: |
          opencode serve &
          echo "OPENCODE_PID=$!" >> $GITHUB_ENV
          sleep 5
          echo "✅ opencode running as background runtime"
      
      # ── Install cloudflared + multica ────────────────────────
      - name: Install cloudflared & multica
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
      
          curl -fsSL https://raw.githubusercontent.com/multica-ai/multica/main/scripts/install.sh | bash
          multica setup self-host \
            --server-url https://mytask.nusantaracode.com \
            --app-url http://mytask.nusantaracode.com
          sleep 5
      
          multica login --token "$MULTICA_TOKEN"
          sleep 5
      
          echo "=== Multica Runtimes ==="
          multica runtime list

      # ── Start Tunnel ke 9router ──────────────────────────────
      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:20128 \
            --no-autoupdate \
            --logfile /tmp/cloudflared.log &

          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "✅ Tunnel URL ditemukan!"
              break
            fi
            echo "Waiting for URL... ($i/30)"
            sleep 3
          done

          echo "========================================"
          echo "🌐 PUBLIC URL  : $TUNNEL_URL"
          echo "📡 API Endpoint: $TUNNEL_URL/v1"
          echo "🔑 Password    : admin123"
          echo "========================================"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      # ── Keep alive ───────────────────────────────────────────
      - name: Keep tunnel alive (15 menit)
        run: |
          echo "========================================"
          echo "🌐 Buka di browser : $TUNNEL_URL"
          echo "🔑 Login password  : admin123"
          echo ""
          echo "Setup opencode di browser:"
          echo "  1. Buka $TUNNEL_URL"
          echo "  2. Login → Providers → Connect Kiro/OpenCode Free"
          echo "  3. Copy API key dari dashboard"
          echo "  4. Pakai di opencode: endpoint $TUNNEL_URL/v1"
          echo "========================================"
          for i in 1 2 3; do
            sleep 300
            echo "⏱️ Menit ke-$((i*5)) — aktif: $TUNNEL_URL"
            docker ps | grep 9router && echo "✅ 9router OK" || echo "❌ 9router DOWN"
          done
