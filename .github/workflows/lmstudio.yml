name: LM Studio + Open WebUI + Tunnel
on: [push]

jobs:
  lmstudio-webui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install LM Studio (llmster) ──────────────────────────
      - name: Install LM Studio
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          echo "$HOME/.lmstudio/bin" >> $GITHUB_PATH

      # ── Start llmster daemon ─────────────────────────────────
      - name: Start llmster daemon
        run: |
          export PATH="$PATH:$HOME/.lmstudio/bin"
          lms daemon up &
          sleep 5
          lms status || true

      # ── Start LM Studio API server (port 1234) ───────────────
      - name: Start LM Studio API server
        run: |
          export PATH="$PATH:$HOME/.lmstudio/bin"
          lms server start
          sleep 3
          lms server status || true

      # ── (Opsional) Download model kecil ─────────────────────
      # Uncomment salah satu — butuh ~500MB-2GB storage
      # - name: Download model
      #   run: |
      #     export PATH="$PATH:$HOME/.lmstudio/bin"
      #     # Pilih salah satu model kecil:
      #     lms get lmstudio/qwen2.5-0.5b-instruct --yes || true
      #     # lms get lmstudio/phi-3.1-mini-4k-instruct --yes || true

      # ── Verify LM Studio API ─────────────────────────────────
      - name: Wait for LM Studio API
        run: |
          echo "Menunggu LM Studio di port 1234..."
          for i in {1..20}; do
            if curl -sf http://localhost:1234/v1/models > /dev/null 2>&1; then
              echo "✅ LM Studio API ready!"
              echo "Models tersedia:"
              curl -s http://localhost:1234/v1/models
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 3
          done

      # ── Start Open WebUI ─────────────────────────────────────
      - name: Start Open WebUI
        run: |
          docker run -d \
            --name open-webui \
            --network host \
            -e OPENAI_API_BASE_URL=http://localhost:1234/v1 \
            -e OPENAI_API_KEY=lm-studio \
            -e WEBUI_SECRET_KEY=ci-secret-key-12345 \
            -e WEBUI_AUTH=false \
            -v open-webui:/app/backend/data \
            ghcr.io/open-webui/open-webui:main

          echo "Menunggu Open WebUI di port 8080..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "✅ Open WebUI ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

          echo "=== Docker logs ==="
          docker logs open-webui --tail 20

      # ── Install cloudflared ──────────────────────────────────
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      # ── Tunnel ke Open WebUI (port 8080) ────────────────────
      - name: Start Cloudflare Tunnel
        run: |
          cloudflared tunnel --url http://localhost:8080 \
            --no-autoupdate \
            --logfile /tmp/cloudflared.log &

          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "✅ Tunnel ready!"
              break
            fi
            echo "Waiting for URL... ($i/30)"
            sleep 3
          done

          echo "========================================"
          echo "🌐 Open WebUI  : $TUNNEL_URL"
          echo "📡 LM Studio   : $TUNNEL_URL/v1 (via WebUI)"
          echo "🔓 Login       : tidak perlu (WEBUI_AUTH=false)"
          echo "========================================"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      # ── Keep alive ───────────────────────────────────────────
      - name: Keep alive (15 menit)
        run: |
          echo "========================================"
          echo "🌐 Buka di browser: $TUNNEL_URL"
          echo ""
          echo "Cara pakai:"
          echo "  1. Buka $TUNNEL_URL di browser"
          echo "  2. Langsung bisa chat (no login)"
          echo "  3. Pilih model di dropdown (kiri atas)"
          echo ""
          echo "Kalau mau tambah model:"
          echo "  → Settings → Models → Pull dari Ollama"
          echo "  → Atau uncomment Download model di workflow"
          echo "========================================"

          for i in 1 2 3; do
            sleep 300
            echo "⏱️ Menit ke-$((i*5)) — $TUNNEL_URL"
            curl -sf http://localhost:8080 > /dev/null && \
              echo "  ✅ Open WebUI: OK" || \
              echo "  ❌ Open WebUI: DOWN"
            curl -sf http://localhost:1234/v1/models > /dev/null && \
              echo "  ✅ LM Studio : OK" || \
              echo "  ❌ LM Studio : DOWN"
          done
